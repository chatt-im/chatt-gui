[package]
name = "chatt-gui"
version = "0.1.0"
edition = "2024"

[features]
default = ["wayland"]
diagnostic-logs = []
wayland = ["gpui/wayland", "gpui_platform/wayland"]
x11 = ["gpui/x11", "gpui_platform/x11"]

[dependencies]
anyhow = "1"
ash = "0.38"
async-channel = "2.5"
gpui = { path = "vendor/zed/crates/gpui", default-features = false }
gpui_platform = { path = "vendor/zed/crates/gpui_platform", default-features = false }
gpui_wgpu = { path = "vendor/zed/crates/gpui_wgpu", default-features = false }
chatt_message_format = { package = "chatt-message-format", git = "https://github.com/chatt-im/chatt.git", rev = "63c144c745565e2493a5695191d8809c7c689db9" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dbus-message = { path = "crates/dbus-message" }
fast-float = "0.2"
image = { version = "0.25", default-features = false }
itoap = { version = "1.0.1", default-features = false }
libc = "0.2"
libmpv2 = { path = "vendor/libmpv2-rs", default-features = false, features = ["render", "vendored"] }
libmpv2-sys = { path = "vendor/libmpv2-rs/libmpv-sys", features = ["vendored"] }
kvlog = { git = "https://github.com/exrok/kvlog", rev = "0e3092abc1a0be07683b42e689a2acef7cf6014b", default-features = false }
log = { version = "0.4", features = ["max_level_info"] }
naga = { path = "vendor/wgpu/naga", features = ["glsl-in", "spv-out", "wgsl-in"] }
local_rpc = { package = "chatt-local-rpc", git = "https://github.com/chatt-im/chatt.git", rev = "63c144c745565e2493a5695191d8809c7c689db9" }
unicode-segmentation = "1"
unicode-width = "0.2"
tempfile = "3"
toml-spanner = { version = "1.0.3", features = [
    "derive",
    "from-toml",
    "to-toml",
] }
zmij = "1.0.23"

[dev-dependencies]
gpui = { path = "vendor/zed/crates/gpui", default-features = false, features = ["test-support"] }

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.dev]
debug = 0

[profile.release]
debug = 0

[patch.crates-io]
calloop = { path = "vendor/forks/calloop-0.14.4" }
cosmic-text = { path = "vendor/forks/cosmic-text-0.19.0" }
fontconfig-parser = { path = "vendor/forks/fontconfig-parser-0.5.8" }
harfrust = { path = "vendor/forks/harfrust-0.5.2" }
naga = { path = "vendor/wgpu/naga" }
wgpu = { path = "vendor/wgpu/wgpu" }
wgpu-core = { path = "vendor/wgpu/wgpu-core" }
wgpu-hal = { path = "vendor/wgpu/wgpu-hal" }
wgpu-naga-bridge = { path = "vendor/wgpu/wgpu-naga-bridge" }
wgpu-types = { path = "vendor/wgpu/wgpu-types" }
