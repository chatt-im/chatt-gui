[workspace]
resolver = "2"
members = [
    "crates/collections",
    "crates/gpui",
    "crates/gpui_linux",
    "crates/gpui_macos",
    "crates/gpui_macros",
    "crates/gpui_platform",
    "crates/gpui_shared_string",
    "crates/gpui_util",
    "crates/gpui_wgpu",
    "crates/media",
    "crates/refineable",
    "crates/refineable/derive_refineable",
    "crates/scheduler",
    "crates/sum_tree",
]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]
collections = { path = "crates/collections", version = "0.1.0" }
component = { path = "crates/component" }
derive_refineable = { path = "crates/refineable/derive_refineable" }
gpui = { path = "crates/gpui", default-features = false }
gpui_linux = { path = "crates/gpui_linux", default-features = false }
gpui_macos = { path = "crates/gpui_macos", default-features = false }
gpui_macros = { path = "crates/gpui_macros" }
gpui_platform = { path = "crates/gpui_platform", default-features = false }
gpui_shared_string = { path = "crates/gpui_shared_string" }
gpui_util = { path = "crates/gpui_util" }
gpui_wgpu = { path = "crates/gpui_wgpu" }
icons = { path = "crates/icons" }
media = { path = "crates/media" }
menu = { path = "crates/menu" }
refineable = { path = "crates/refineable" }
scheduler = { path = "crates/scheduler" }
sum_tree = { path = "crates/sum_tree" }
syntax_theme = { path = "crates/syntax_theme" }
theme = { path = "crates/theme" }
ui = { path = "crates/ui" }
ui_macros = { path = "crates/ui_macros" }

accesskit_macos = "0.26.0"
accesskit_unix = "0.21.0"
anyhow = "1.0.86"
async-channel = "2.5.0"
async-task = "4.7"
backtrace = "0.3"
base64 = "0.22"
bitflags = "2.6.0"
block2 = "0.6"
cocoa = "=0.26.0"
cocoa-foundation = "=0.2.0"
core-foundation = "0.10"
core-foundation-sys = "0.8.6"
ctor = "1.0.6"
documented = "0.9.1"
flume = "0.12"
futures = "0.3.32"
futures-concurrency = "7.7.1"
hdrhistogram = "7"
heapless = "0.9.2"
heck = "0.5"
inventory = "0.3.19"
itertools = "0.14.0"
libc = "0.2"
linkify = "0.10.0"
mach2 = "0.5"
metal = "0.33"
notify-rust = "4"
num-format = "0.4.4"
objc = "0.2"
objc2 = "0.6"
objc2-user-notifications = "0.3"
parking_lot = "0.12.1"
proc-macro2 = "1.0.93"
profiling = "1"
pollster = "0.4.0"
quote = "1.0.9"
rand = "0.9"
rayon = "1.8"
raw-window-handle = "0.6"
regex = "1.5"
rustc-hash = "2.1.0"
slotmap = "1.0.6"
smol = "2.0"
stacksafe = "0.1"
thiserror = "2.0.12"
unicode-segmentation = "1.10"
web-time = "1.1.0"
wgpu = "29.0.4"

[workspace.dependencies.accesskit]
version = "0.24.0"
features = ["enumn"]

[workspace.dependencies.ashpd]
version = "0.13"
default-features = false
features = ["async-io", "notification", "open_uri", "file_chooser", "settings", "trash"]

[workspace.dependencies.chrono]
version = "0.4"

[workspace.dependencies.core-video]
version = "0.5.2"
features = ["metal"]

[workspace.dependencies.derive_more]
version = "2.1.1"
features = ["add", "add_assign", "deref", "deref_mut", "display", "from_str", "mul", "mul_assign", "not"]

[workspace.dependencies.image]
version = "0.25.1"
default-features = false
features = ["gif", "jpeg", "png", "webp"]

[workspace.dependencies.indexmap]
version = "2.7.0"

[workspace.dependencies.log]
version = "0.4.16"

[workspace.dependencies.objc2-app-kit]
version = "0.3.2"
default-features = false
features = ["NSButton", "NSControl", "NSGraphics", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"]

[workspace.dependencies.objc2-foundation]
version = "=0.3.2"
default-features = false
features = ["NSArray", "NSAttributedString", "NSBundle", "NSCoder", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSNotification", "NSNull", "NSObjCRuntime", "NSObject", "NSProcessInfo", "NSRange", "NSRunLoop", "NSSet", "NSString", "NSURL", "NSUndoManager", "NSValue", "objc2-core-foundation", "std"]

[workspace.dependencies.palette]
version = "0.7.5"
default-features = false
features = ["std"]

[workspace.dependencies.postage]
version = "0.5"
features = ["futures-traits"]

[workspace.dependencies.pulldown-cmark]
version = "0.13.0"
default-features = false

[workspace.dependencies.resvg]
version = "0.47.0"
default-features = false
features = ["text", "system-fonts", "memmap-fonts", "raster-images"]

[workspace.dependencies.scap]
git = "https://github.com/zed-industries/scap"
rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac"
default-features = false
package = "zed-scap"
version = "0.0.8-zed"

[workspace.dependencies.semver]
version = "1.0"

[workspace.dependencies.smallvec]
version = "1.6"
features = ["union", "const_new"]

[workspace.dependencies.strum]
version = "0.27.2"
features = ["derive"]

[workspace.dependencies.syn]
version = "2.0.101"
features = ["full", "extra-traits", "visit-mut"]

[workspace.dependencies.usvg]
version = "0.47.0"
default-features = false

[workspace.dependencies.uuid]
version = "1.1.2"
features = ["v4", "v5", "v7"]

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
